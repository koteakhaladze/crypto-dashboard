<!-- dashboard/templates/dashboard/backtest.html -->
{% extends 'dashboard/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid p-4">
    {% csrf_token %}
    <div class="row mb-4">
        <div class="col-md-4">
            <label>Start Date</label>
            <input type="date" id="start-date" class="form-control bg-dark text-light" 
                   value="{{ default_start|date:'Y-m-d' }}" min="2023-01-01">
        </div>
        <div class="col-md-4">
            <label>Symbol</label>
            <select id="symbol" class="form-control bg-dark text-light">
                {% for symbol in symbols %}
                    <option value="{{ symbol }}">{{ symbol }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label>Sensitivity</label>
            <input type="number" id="sensitivity" class="form-control bg-dark text-light" 
                   value="{{ default_sensitivity }}" step="0.1" min="0.1" max="5.0">
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <label>End Date</label>
            <input type="date" id="end-date" class="form-control bg-dark text-light" 
                   value="{{ default_end|date:'Y-m-d' }}" min="2023-01-01">
        </div>
        <div class="col-md-4">
            <label>Timeframe</label>
            <select id="timeframe" class="form-control bg-dark text-light">
                {% for tf in timeframes %}
                    <option value="{{ tf }}">{{ tf }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label>ATR Period</label>
            <input type="number" id="atr-period" class="form-control bg-dark text-light" 
                   value="{{ default_atr_period }}" min="5" max="50">
        </div>
    </div>

    <div class="row">
        <div class="col">
            <button id="run-backtest" class="btn btn-primary">Run Backtest</button>
            <div id="loading-indicator" class="d-none ms-3 d-inline-block">
                <div class="spinner-border text-light" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <span class="text-light ms-2">Running backtest...</span>
            </div>
        </div>
    </div>

    <div id="chart-container" class="mt-4" style="height: 800px;"></div>

    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card bg-dark text-light">
                <div class="card-body">
                    <h5 class="card-title">Total Return</h5>
                    <p class="card-text" id="total-return">-</p>
                </div>
            </div>
        </div>
        <!-- Add more metric cards -->
    </div>

    <div class="mt-4">
        <h3 class="text-light">Monthly Returns (%)</h3>
        <div id="pnl-table"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://code.highcharts.com/stock/highstock.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Set minimum date to 2023-01-01 for date inputs
    const minDate = "2023-01-01";
    document.getElementById('start-date').setAttribute('min', minDate);
    document.getElementById('end-date').setAttribute('min', minDate);
    
    // Validate that dates aren't before 2023
    function validateDates() {
        const startDate = document.getElementById('start-date');
        const endDate = document.getElementById('end-date');
        
        if (startDate.value < minDate) {
            startDate.value = minDate;
        }
        
        if (endDate.value < minDate) {
            endDate.value = minDate;
        }
    }
    
    // Add validation when inputs change
    document.getElementById('start-date').addEventListener('change', validateDates);
    document.getElementById('end-date').addEventListener('change', validateDates);
    
    // Run initial validation
    validateDates();

    document.getElementById('run-backtest').addEventListener('click', function() {
        // Show loading indicator
        const loadingIndicator = document.getElementById('loading-indicator');
        loadingIndicator.classList.remove('d-none');
        
        // Disable run button while processing
        const runButton = document.getElementById('run-backtest');
        runButton.disabled = true;
        
        const params = {
            start_date: document.getElementById('start-date').value,
            end_date: document.getElementById('end-date').value,
            symbol: document.getElementById('symbol').value,
            timeframe: document.getElementById('timeframe').value,
            sensitivity: document.getElementById('sensitivity').value,
            atr_period: document.getElementById('atr-period').value
        };
        
        // Add validation for future dates
        const today = new Date();
        const endDate = new Date(params.end_date);
        
        if (endDate > today) {
            alert("Warning: End date is in the future. Data may be limited or unavailable.");
        }

        fetch('/run_backtest/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify(params)
        })
        .then(response => response.json())
        .then(data => {
            console.log("Backtest data received:", data);
            if (data.success) {
                try {
                    // Validate we have signals data before updating chart
                    if (data.data && data.data.signals && Array.isArray(data.data.signals) && data.data.signals.length > 0) {
                        updateChart(data.data.signals);
                    } else {
                        document.getElementById('chart-container').innerHTML = 
                            '<div class="alert alert-warning">No price data available for the selected period.</div>';
                    }
                    
                    // Validate metrics data
                    if (data.data && data.data.metrics && typeof data.data.metrics === 'object') {
                        updateMetrics(data.data.metrics);
                    } else {
                        console.warn("Missing or invalid metrics data");
                        document.querySelector('.row.mt-4').innerHTML = 
                            '<div class="col-12"><div class="alert alert-warning">No metrics data available.</div></div>';
                    }
                    
                    // Validate PnL table data with extra safety
                    if (data.data && data.data.pnl_table && typeof data.data.pnl_table === 'object') {
                        console.log("Processing PnL table data:", JSON.stringify(data.data.pnl_table).substring(0, 200) + "...");
                        try {
                            updatePnLTable(data.data.pnl_table);
                        } catch (pnlError) {
                            console.error("Error updating PnL table:", pnlError);
                            document.getElementById('pnl-table').innerHTML = 
                                '<div class="alert alert-warning">Could not process monthly returns data.</div>';
                        }
                    } else {
                        console.warn("Missing or invalid PnL table data");
                        document.getElementById('pnl-table').innerHTML = 
                            '<div class="alert alert-warning">No monthly returns data available.</div>';
                    }
                } catch (err) {
                    console.error("Error processing backtest results:", err);
                    alert(`Error processing backtest results: ${err.message}`);
                }
            } else if (data.error) {
                alert(`Error running backtest: ${data.error}`);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert(`Failed to run backtest: ${error.message}`);
        })
        .finally(() => {
            // Hide loading indicator
            loadingIndicator.classList.add('d-none');
            // Re-enable run button
            runButton.disabled = false;
        });
    });

    function getCookie(name) {
        // Django CSRF token getter implementation
    }

    function updateChart(signals) {
    const chartConfig = {
        chart: {
            height: 800,
            backgroundColor: '#FFFFFF',  // White background
            style: {color: '#000000'}    // Black text
        },
        title: {
            text: `Trading Strategy - ${document.getElementById('symbol').value} ${document.getElementById('timeframe').value}`,
            style: {color: '#000000'}    // Black title text
        },
        series: [
            {
                type: 'candlestick',
                name: 'Price',
                data: signals.map(x => [
                    new Date(x.Datetime).getTime(),
                    parseFloat(x.Open),
                    parseFloat(x.High),
                    parseFloat(x.Low),
                    parseFloat(x.Close)
                ]),
                color: '#000000',        // Downward candle color (black)
                upColor: '#00CC00',      // Upward candle color (green)
                lineColor: '#000000',    // Downward border color
                upLineColor: '#007700'   // Upward border color (darker green)
            },
            {
                type: 'scatter',
                name: 'Buy Signals',
                data: signals.filter(x => x.Buy).map(x => ({
                    x: new Date(x.Datetime).getTime(),
                    y: parseFloat(x.Low) * 0.995, // Position slightly below the low price
                    marker: {symbol: 'triangle', fillColor: 'yellow', lineWidth: 1, lineColor: '#000000', radius: 7}
                }))
            },
            {
                type: 'scatter',
                name: 'Sell Signals',
                data: signals.filter(x => x.Sell).map(x => ({
                    x: new Date(x.Datetime).getTime(),
                    y: parseFloat(x.High) * 1.005, // Position slightly above the high price
                    marker: {symbol: 'triangle-down', fillColor: '#FF0000', lineWidth: 1, lineColor: '#000000', radius: 7}
                }))
            }
        ],
        plotOptions: {
            candlestick: {
                lineWidth: 1,
                color: '#000000',       // Downward candle color (black)
                upColor: '#00CC00'      // Upward candle color (green)
            }
        },
        xAxis: {
            lineColor: '#CCCCCC',
            tickColor: '#CCCCCC',
            labels: {
                style: {
                    color: '#000000'
                }
            }
        },
        yAxis: {
            gridLineColor: '#EEEEEE',
            labels: {
                style: {
                    color: '#000000'
                }
            }
        },
        navigator: {
            enabled: true,
            outlineColor: '#CCCCCC',
            handles: {
                backgroundColor: '#FFFFFF',
                borderColor: '#666666'
            },
            series: {
                color: '#CCCCCC',
                lineColor: '#666666'
            }
        },
        scrollbar: {
            barBackgroundColor: '#EEEEEE',
            barBorderColor: '#CCCCCC',
            buttonBackgroundColor: '#FFFFFF',
            buttonBorderColor: '#CCCCCC',
            trackBackgroundColor: '#FFFFFF',
            trackBorderColor: '#EEEEEE'
        },
        tooltip: {
            backgroundColor: 'rgba(255, 255, 255, 0.9)',
            borderColor: '#CCCCCC',
            style: {
                color: '#000000'
            },
            xDateFormat: '%b %e, %Y %H:%M',
            shared: true,
            useHTML: true,
            formatter: function() {
                // Safety check to ensure we have points
                if (!this.points || this.points.length === 0) {
                    return false; // Don't show tooltip if no points
                }
                
                try {
                    const date = Highcharts.dateFormat('%b %e, %Y %H:%M', this.x);
                    let text = `<b>${date}</b><br/>`;
                    
                    // Add point-specific information
                    this.points.forEach(function(pointObj) {
                        if (!pointObj || !pointObj.series) return; // Skip invalid points
                        
                        const seriesName = pointObj.series.name;
                        
                        if (seriesName === 'Buy Signals') {
                            text += `<span style="color:${pointObj.color || '#000000'}">●</span> <b>Buy Signal</b><br/>`;
                            text += `Price: ${(pointObj.y || 0).toFixed(2)}<br/>`;
                        } else if (seriesName === 'Sell Signals') {
                            text += `<span style="color:${pointObj.color || '#FF0000'}">●</span> <b>Sell Signal</b><br/>`;
                            text += `Price: ${(pointObj.y || 0).toFixed(2)}<br/>`;
                        } else if (seriesName === 'Price') {
                            // Safely access OHLC data
                            if (pointObj.point) {
                                const point = pointObj.point;
                                const open = typeof point.open === 'number' ? point.open.toFixed(2) : 'N/A';
                                const high = typeof point.high === 'number' ? point.high.toFixed(2) : 'N/A';
                                const low = typeof point.low === 'number' ? point.low.toFixed(2) : 'N/A';
                                const close = typeof point.close === 'number' ? point.close.toFixed(2) : 'N/A';
                                
                                text += `Open: ${open}<br/>`;
                                text += `High: ${high}<br/>`;
                                text += `Low: ${low}<br/>`;
                                text += `Close: ${close}<br/>`;
                            }
                        }
                    });
                    
                    return text;
                } catch (error) {
                    console.error('Error generating tooltip:', error);
                    return `<b>${Highcharts.dateFormat('%b %e, %Y', this.x)}</b><br/>Error displaying details`;
                }
            }
        },
        legend: {
            itemStyle: {
                color: '#000000'
            }
        }
    };

    Highcharts.stockChart('chart-container', chartConfig);
}

function updateMetrics(metrics) {
    // Create an array of metrics to display
    const metricsToDisplay = [
        { label: 'Total Return', value: `${metrics['Total Return [%]'].toFixed(2)}%` },
        { label: 'Benchmark Return', value: `${metrics['Benchmark Return [%]'].toFixed(2)}%` },
        { label: 'Max Drawdown', value: `${metrics['Max Drawdown [%]'].toFixed(2)}%` },
        { label: 'Total Trades', value: metrics['Total Trades'] },
        { label: 'Win Rate', value: `${metrics['Win Rate [%]'].toFixed(2)}%` },
        { label: 'Profit Factor', value: metrics['Profit Factor'].toFixed(2) },
        { label: 'Sharpe Ratio', value: metrics['Sharpe Ratio'].toFixed(2) },
        { label: 'Best Trade', value: `${metrics['Best Trade [%]'].toFixed(2)}%` },
        { label: 'Worst Trade', value: `${metrics['Worst Trade [%]'].toFixed(2)}%` }
    ];

    // Clear existing metric cards
    const metricsContainer = document.querySelector('.row.mt-4');
    metricsContainer.innerHTML = '';

    // Create and append metric cards
    metricsToDisplay.forEach(metric => {
        const col = document.createElement('div');
        col.className = 'col-md-3';
        
        const card = document.createElement('div');
        card.className = 'card bg-dark text-light mb-3';
        
        const cardBody = document.createElement('div');
        cardBody.className = 'card-body';
        
        const cardTitle = document.createElement('h5');
        cardTitle.className = 'card-title';
        cardTitle.textContent = metric.label;
        
        const cardText = document.createElement('p');
        cardText.className = 'card-text';
        cardText.textContent = metric.value;
        
        cardBody.appendChild(cardTitle);
        cardBody.appendChild(cardText);
        card.appendChild(cardBody);
        col.appendChild(card);
        
        metricsContainer.appendChild(col);
    });
}
function updatePnLTable(pnlData) {
    const tableContainer = document.getElementById('pnl-table');
    
    // Safely handle empty or invalid pnlData
    if (!pnlData || Object.keys(pnlData).length === 0) {
        tableContainer.innerHTML = '<div class="alert alert-warning">No monthly return data available for the selected period.</div>';
        return;
    }
    
    // Get unique years dynamically with extra safety checks
    const years = [];
    try {
        // First check if pnlData has expected structure
        if (pnlData && typeof pnlData === 'object') {
            const hasValidData = Object.values(pnlData).some(monthData => 
                monthData && typeof monthData === 'object' && Object.keys(monthData).length > 0
            );
            
            if (hasValidData) {
                const yearsSet = new Set();
                
                // Safely extract all valid years
                Object.entries(pnlData).forEach(([month, monthData]) => {
                    if (monthData && typeof monthData === 'object') {
                        Object.keys(monthData).forEach(year => {
                            // Only add valid years (strings that represent numbers)
                            if (year && /^\d{4}$/.test(year)) {
                                yearsSet.add(year);
                            }
                        });
                    }
                });
                
                // Sort years numerically
                years.push(...Array.from(yearsSet).sort((a, b) => parseInt(a) - parseInt(b)));
            }
        }
    } catch (error) {
        console.error('Error processing years data:', error);
        tableContainer.innerHTML = '<div class="alert alert-danger">Error processing monthly return data.</div>';
        return;
    }
    
    // If no valid years found
    if (years.length === 0) {
        tableContainer.innerHTML = '<div class="alert alert-warning">No data available for the selected period.</div>';
        return;
    }
    
    // Create table element
    const table = document.createElement('table');
    table.className = 'table table-dark table-striped table-bordered';
    
    // Create table header
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    
    // Add Month column
    const monthHeader = document.createElement('th');
    monthHeader.textContent = 'Month';
    headerRow.appendChild(monthHeader);
    
    // Add year columns dynamically
    years.forEach(year => {
        const yearHeader = document.createElement('th');
        yearHeader.textContent = year;
        headerRow.appendChild(yearHeader);
    });
    
    thead.appendChild(headerRow);
    table.appendChild(thead);
    
    // Create table body
    const tbody = document.createElement('tbody');
    
    // Months in order
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Year'];
    
    months.forEach(month => {
        const row = document.createElement('tr');
        
        // Month name
        const monthCell = document.createElement('td');
        monthCell.textContent = month;
        row.appendChild(monthCell);
        
        // Add value for each year with safety checks
        years.forEach(year => {
            const yearCell = document.createElement('td');
            
            try {
                // Get month data or empty object
                const monthData = pnlData[month] || {};
                
                // Safely access the value
                const value = monthData[year];
                
                // Check if value is a valid number before using toFixed
                if (value !== undefined && value !== null && typeof value === 'number' && !isNaN(value)) {
                    yearCell.textContent = value.toFixed(2);
                } else {
                    yearCell.textContent = '-';
                }
            } catch (error) {
                console.error(`Error processing data for ${month} ${year}:`, error);
                yearCell.textContent = '-';
            }
            
            row.appendChild(yearCell);
        });
        
        tbody.appendChild(row);
    });
    
    table.appendChild(tbody);
    
    // Clear previous content and add new table
    tableContainer.innerHTML = '';
    tableContainer.appendChild(table);
}
});
</script>
{% endblock %}
